name: adventure_world
description: "Adventure World - A fun logic puzzle game for kids."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  
  # Routing
  go_router: ^17.0.0
  
  # Audio
  audioplayers: ^6.5.1
  
  # Local storage (JSON-based, simpler than Isar)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  
  # Sharing and URL launching
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  
  # Responsive design
  responsive_framework: ^1.5.1
  
  # Utilities
  equatable: ^2.0.7
  
  # Ads
  google_mobile_ads: ^6.0.0
  
  # Fonts
  google_fonts: ^6.3.2
  
  # Firebase
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  firebase_analytics: ^12.0.4
  
  # App Tracking Transparency (iOS)
  app_tracking_transparency: ^2.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  # Code generation for Riverpod
  build_runner: ^2.7.1
  riverpod_generator: ^3.0.3
  # hive_generator: ^2.0.1

flutter:

  uses-material-design: true
  
  # Assets
  assets:
    - assets/sounds/
    - assets/music/
