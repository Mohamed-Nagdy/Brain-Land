name: brain_land
description: "Brain Land — puzzle adventure by ATHRYZA Technologies."

publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  audioplayers: ^6.8.1
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.2
  # Child-directed ads on Android and iOS (lib/ads/ads.dart).
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#6B4CE6"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter_native_splash:
  color: "#6B4CE6"
  image: "assets/icon/icon.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/svg/mascot/
    - assets/svg/worlds/
    - assets/svg/ui/
    - assets/svg/math/
    - assets/svg/tokens/
    - assets/svg/slots/
    - assets/svg/memory/
    - assets/svg/rewards/
    - assets/audio/sfx/
    - assets/audio/voice/ar/
    - assets/audio/voice/en/
  fonts:
    - family: Baloo
      fonts:
        - asset: assets/fonts/BalooBhaijaan2-Variable.ttf
