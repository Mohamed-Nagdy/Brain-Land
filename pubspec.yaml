name: brain_land
description: "MagicMind - A fun logic puzzle game for kids."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Routing
  go_router: ^14.6.2
  
  # Audio
  audioplayers: ^6.1.0
  
  # Local storage (JSON-based, simpler than Isar)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  
  # Sharing and URL launching
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  
  # Responsive design
  responsive_framework: ^1.5.1
  
  # Utilities
  equatable: ^2.0.5
  
  # Ads
  google_mobile_ads: ^6.0.0
  
  # Fonts
  google_fonts: ^6.2.1
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
  firebase_analytics: ^11.3.5
  
  # App Tracking Transparency (iOS)
  app_tracking_transparency: ^2.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  
  # Code generation for Riverpod
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  analyzer: ^6.4.1

flutter:

  uses-material-design: true
  
  # Assets
  assets:
    - assets/sounds/
    - assets/music/
